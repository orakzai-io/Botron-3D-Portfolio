<section class="bt-beat bt-beat--skills" id="skills">
  <div class="bt-beat-grid bt-skills-grid">
    <div class="bt-beat-copy bt-reveal">
      <p class="bt-kicker">02 // SYSTEM SPECIFICATIONS</p>
      <h2 class="bt-beat-title" data-text="SKILLS MATRIX">SKILLS <span class="bt-beat-accent">MATRIX</span></h2>

      <!-- Category Filter Tabs -->
      <div class="bt-filter-bar">
        <button type="button" class="bt-filter-pill active" data-category="all">ALL (29)</button>
        <button type="button" class="bt-filter-pill" data-category="ai">AI & LLM (9)</button>
        <button type="button" class="bt-filter-pill" data-category="backend">BACKEND (7)</button>
        <button type="button" class="bt-filter-pill" data-category="devops">DEVOPS (4)</button>
        <button type="button" class="bt-filter-pill" data-category="frontend">FRONTEND (5)</button>
        <button type="button" class="bt-filter-pill" data-category="tools">TOOLS (4)</button>
      </div>

      <!-- Live Skill Telemetry HUD Card -->
      <div class="bt-telemetry-hud" id="bt-telemetry-hud">
        <div class="bt-telemetry-header">
          <div class="bt-telemetry-badge">
            <span class="bt-telemetry-icon" id="bt-telemetry-icon">⚡</span>
            <span class="bt-telemetry-cat" id="bt-telemetry-cat">AI & LLM</span>
          </div>
          <div class="bt-telemetry-status">
            <span class="bt-telemetry-dot"></span>
            <span class="bt-telemetry-level" id="bt-telemetry-level">99%</span>
          </div>
        </div>
        <h3 class="bt-telemetry-title" id="bt-telemetry-name">OpenAI API</h3>
        <p class="bt-telemetry-desc" id="bt-telemetry-desc">
          GPT-4o/o1 reasoning, tool-calling pipelines & system guardrails
        </p>
        <div class="bt-telemetry-meter">
          <div class="bt-telemetry-fill" id="bt-telemetry-bar" style="width: 99%"></div>
        </div>
        <div class="bt-telemetry-hint">HOVER OR DRAG 3D GLOBE TO INSPECT NODES</div>
      </div>
    </div>

    <!-- 3D Holographic Globe Stage -->
    <div class="bt-skills-stage" id="skills-globe-container">
      <div class="bt-globe-reticle">
        <span class="bt-globe-tag">// 3D MATRIX HUD //</span>
        <span class="bt-globe-coords">LAT: 34.01° · LON: 71.52°</span>
      </div>
      <canvas id="skills-globe"></canvas>
      <div class="bt-globe-drag-hint">
        <span>‹ DRAG TO ROTATE · HOVER TO INSPECT ›</span>
      </div>
    </div>
  </div>
</section>
